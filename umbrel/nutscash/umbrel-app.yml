name: NutsCash
tagline: Cashu wallet and Nostr client in one app
version: "0.2.7"
description: >-
  NutsCash is an open-source web wallet for Cashu ecash with integrated Nostr social features.

  It supports multiple mints, minting and melting via Lightning, NIP-60 backup, and private ecash zaps.

  This package is intended for self-hosting on umbrelOS.
