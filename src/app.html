<!doctype html>
<html lang="en" data-theme="nuts">
	<head>
		<link rel="icon" href="/nuts-icon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="black-translucent" />
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rock+Salt&display=swap"
			rel="stylesheet"
		/>

		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Nuts" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		%sveltekit.head%
	</head>
	<style>
		html {
			font-family: "Suisse Int'l", monospace;
			isolation: isolate;
		}
		body {
			margin: 0;
			padding: 0 0 env(safe-area-inset-bottom) 0;
			background-image: var(--bg-basic);
			background-size: 100% 100%;
			background-position: center center;
			background-repeat: no-repeat;
			min-height: 100vh;
			width: 100%;
		}
		#loader {
			position: fixed;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: #0b1712;
			z-index: 9999;
			filter: brightness(0.8) contrast(1.2);
		}
		#loader.hidden {
			pointer-events: none;
		}
		#loader.hidden img {
			animation: exit-grow 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
		}
		#loader img {
			width: 120px;
			height: 120px;
			object-fit: contain;
			animation: heartbeat 1.5s ease-in-out infinite;
		}
		@keyframes heartbeat {
			0%,
			100% {
				transform: scale(1);
				opacity: 0.8;
			}
			14% {
				transform: scale(1.15);
				opacity: 1;
			}
			28% {
				transform: scale(1);
				opacity: 0.8;
			}
			42% {
				transform: scale(1.15);
				opacity: 1;
			}
			70% {
				transform: scale(1);
				opacity: 0.8;
			}
		}
		@keyframes exit-grow {
			0% {
				transform: scale(1);
				opacity: 1;
			}
			100% {
				transform: scale(5);
				opacity: 0;
			}
		}
	</style>
	<body data-sveltekit-preload-data="hover" class="w-screen">
		<div id="loader">
			<img src="/nuts-icon.svg" alt="Nuts" />
		</div>
		<div>%sveltekit.body%</div>
		<script>
			(function () {
				const loader = document.getElementById('loader');
				const hideLoader = function () {
					if (loader && !loader.classList.contains('hidden')) {
						loader.classList.add('hidden');
						setTimeout(function () {
							if (loader.parentNode) {
								loader.parentNode.removeChild(loader);
							}
						}, 500);
					}
				};
				// Hide when page assets are fully loaded
				window.addEventListener('load', hideLoader);
			})();
		</script>
	</body>
</html>
