	<style>
		html {
			font-family: "Suisse Int'l", monospace;
			isolation: isolate;
		}
		body {
			margin: 0;
			padding: 0 0 env(safe-area-inset-bottom) 0;
			background-image: var(--bg-basic);
			background-size: 100% 100%;
			background-position: center center;
			background-repeat: no-repeat;
			min-height: 100vh;
			width: 100%;
		}
		#loader {
			position: fixed;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			background-color: #0b1712;
			z-index: 9999;
			filter: brightness(0.8) contrast(1.2);
		}
		#loader.hidden {
			pointer-events: none;
		}
		#loader.hidden svg {
			animation: exit-grow 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
		}
		#loader svg {
			width: 120px;
			height: 120px;
			animation: heartbeat 1.5s ease-in-out infinite;
		}
		@keyframes heartbeat {
			0%,
			100% {
				transform: scale(1);
				opacity: 0.8;
			}
			14% {
				transform: scale(1.15);
				opacity: 1;
			}
			28% {
				transform: scale(1);
				opacity: 0.8;
			}
			42% {
				transform: scale(1.15);
				opacity: 1;
			}
			70% {
				transform: scale(1);
				opacity: 0.8;
			}
		}
		@keyframes exit-grow {
			0% {
				transform: scale(1);
				opacity: 1;
			}
			100% {
				transform: scale(5);
				opacity: 0;
			}
		}
	</style>
