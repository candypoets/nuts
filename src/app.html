<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<link rel="apple-touch-icon" href="/maskable_icon_180.png" />
		<meta name="theme-color" content="black-translucent" />
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width; initial-scale=1; viewport-fit=cover" />

		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp" />
		<meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin" />
		%sveltekit.head%
	</head>
	<style>
		html {
			font-family: "Suisse Int'l", monospace;
			background-image: var(--bg-basic);
			background-color: var(--bg);
			background-size: auto 100%;
			background-position: center center;
			background-repeat: no-repeat;
			filter: brightness(0.8) contrast(1.2);
			isolation: isolate;
		}
		body {
			background-image: var('/nutscash.svg');
			background-size: auto 100%;
			background-position: center center;
			background-repeat: no-repeat;
			isolation: isolate;
		}
	</style>
	<body data-sveltekit-preload-data="hover" class="w-screen">
		<div>%sveltekit.body%</div>
	</body>
</html>
