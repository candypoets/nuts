[package]
name = "nutscash-nostr"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.dev]
debug = 2              # Full debug info
panic = "unwind"       # Allow unwinding for better stack traces
opt-level = 0          # No optimization
overflow-checks = true
lto = false
codegen-units = 256
incremental = true

[dependencies]
# Async runtime and utilities
tokio = { version = "1.0", features = ["macros", "sync", "rt"] }
tokio_with_wasm = { version = "0.8.6", features = ["rt"] }
tokio-util = "0.7"
futures = "0.3"

instant = { version = "0.1", features = ["wasm-bindgen"] }
gloo-timers = { version = "0.3", features = ["futures"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Regular expressions
regex = "1.0"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Nostr
nostr = { version = "0.29", features = ["nip04", "nip44"] }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde", "js"] }
url = "2.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }

# WASM-native WebSocket support
ws_stream_wasm = "0.7"
futures-util = "0.3"

# WASM bindings (all targets for now to avoid conditional compilation issues)
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen-test = "0.3.50"

[dependencies.web-sys]
version = "0.3"
features = [
    "console",
    "Window",
    "Worker",
    "WorkerGlobalScope",
    "MessageEvent",
    "MessagePort",
    "DedicatedWorkerGlobalScope",
    "WebSocket",
    "CloseEvent",
    "ErrorEvent",
    "Event",
    "BinaryType",
]

[features]
default = ["console_error_panic_hook"]
