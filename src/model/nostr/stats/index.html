<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Go Goroutine Monitor</title>
		<script src="./wasm_exec.js"></script>
		<script>
			// Load and run the WebAssembly module
			const go = new Go();
			WebAssembly.instantiateStreaming(fetch('./main.wasm'), go.importObject).then((result) => {
				go.run(result.instance);

				// Start the goroutine monitor after WASM is loaded
				if (window.startGoroutineMonitor) {
					window.startGoroutineMonitor();
				}
			});

			// Function to get subscription count
			window.getSubscriptionCount = function () {
				// Call your Go function to get the subscription count
				if (window.getActiveSubscriptionCount) {
					return window.getActiveSubscriptionCount();
				}
				return '-';
			};
		</script>
		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
		<style>
			body {
				font-family: Arial, sans-serif;
				margin: 0;
				padding: 20px;
				background-color: #f5f5f5;
			}
			.dashboard {
				display: grid;
				grid-template-columns: 1fr 1fr;
				grid-gap: 20px;
			}
			.card {
				background: white;
				border-radius: 8px;
				padding: 15px;
				box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
			}
			.full-width {
				grid-column: 1 / 3;
			}
			.stats {
				display: flex;
				justify-content: space-around;
				margin-bottom: 20px;
			}
			.stat-box {
				text-align: center;
				padding: 15px;
				background: #f0f7ff;
				border-radius: 8px;
				min-width: 120px;
			}
			.stat-value {
				font-size: 24px;
				font-weight: bold;
				color: #0066cc;
			}
			.stat-label {
				font-size: 14px;
				color: #555;
			}
			table {
				width: 100%;
				border-collapse: collapse;
			}
			th,
			td {
				padding: 10px;
				text-align: left;
				border-bottom: 1px solid #ddd;
			}
			th {
				background-color: #f2f2f2;
			}
			.running {
				color: green;
			}
			.sleeping {
				color: blue;
			}
			.waiting {
				color: orange;
			}
			.stack-trace {
				font-family: monospace;
				font-size: 12px;
				max-height: 100px;
				overflow-y: auto;
				background: #f9f9f9;
				padding: 5px;
				border-radius: 4px;
				margin-top: 5px;
			}
			.hidden {
				display: none;
			}
		</style>
	</head>
	<body>
		<h1>Go Goroutine Monitor</h1>

		<div class="dashboard">
			<div class="card full-width">
				<div class="stats">
					<div class="stat-box">
						<div class="stat-value" id="goroutine-count">-</div>
						<div class="stat-label">Goroutines</div>
					</div>
					<div class="stat-box">
						<div class="stat-value" id="memory-usage">-</div>
						<div class="stat-label">Memory (KB)</div>
					</div>
					<div class="stat-box">
						<div class="stat-value" id="subscription-count">-</div>
						<div class="stat-label">Subscriptions</div>
					</div>
				</div>
			</div>

			<div class="card">
				<h2>Goroutine Count History</h2>
				<canvas id="goroutine-chart"></canvas>
			</div>

			<div class="card">
				<h2>Memory Usage History</h2>
				<canvas id="memory-chart"></canvas>
			</div>

			<div class="card full-width">
				<h2>Active Goroutines</h2>
				<table id="goroutine-table">
					<thead>
						<tr>
							<th>ID</th>
							<th>State</th>
							<th>Function</th>
							<th>Details</th>
						</tr>
					</thead>
					<tbody></tbody>
				</table>
			</div>
		</div>

		<script>
			// Chart objects
			let goroutineChart, memoryChart;
			let historyData = [];

			// Initialize charts
			function initCharts() {
				const goroutineCtx = document.getElementById('goroutine-chart').getContext('2d');
				goroutineChart = new Chart(goroutineCtx, {
					type: 'line',
					data: {
						labels: [],
						datasets: [
							{
								label: 'Goroutine Count',
								data: [],
								borderColor: 'rgb(75, 192, 192)',
								tension: 0.1
							}
						]
					},
					options: {
						scales: {
							y: {
								beginAtZero: true
							}
						}
					}
				});

				const memoryCtx = document.getElementById('memory-chart').getContext('2d');
				memoryChart = new Chart(memoryCtx, {
					type: 'line',
					data: {
						labels: [],
						datasets: [
							{
								label: 'Memory Usage (KB)',
								data: [],
								borderColor: 'rgb(255, 99, 132)',
								tension: 0.1
							}
						]
					},
					options: {
						scales: {
							y: {
								beginAtZero: true
							}
						}
					}
				});
			}

			// Update charts with new data
			function updateCharts() {
				if (!historyData.length) return;

				const timeLabels = historyData.map((d) => {
					const date = new Date(d.timestamp * 1000);
					return date.toLocaleTimeString();
				});

				goroutineChart.data.labels = timeLabels;
				goroutineChart.data.datasets[0].data = historyData.map((d) => d.count);
				goroutineChart.update();

				memoryChart.data.labels = timeLabels;
				memoryChart.data.datasets[0].data = historyData.map((d) => d.memoryKB);
				memoryChart.update();
			}

			// Update stats display
			function updateStats() {
				if (!historyData.length) return;

				const latest = historyData[historyData.length - 1];
				document.getElementById('goroutine-count').textContent = latest.count;
				document.getElementById('memory-usage').textContent = latest.memoryKB;

				// This would need to be updated with actual subscription count
				// from your Go code if available
				if (window.getSubscriptionCount) {
					document.getElementById('subscription-count').textContent = window.getSubscriptionCount();
				}
			}

			// Update goroutine table
			function updateGoroutineTable() {
				window.getCurrentGoroutineDetails().then((detailsJson) => {
					const details = JSON.parse(detailsJson);
					const tbody = document.querySelector('#goroutine-table tbody');
					tbody.innerHTML = '';

					details.forEach((goroutine) => {
						const row = document.createElement('tr');

						// ID cell
						const idCell = document.createElement('td');
						idCell.textContent = goroutine.id;
						row.appendChild(idCell);

						// State cell
						const stateCell = document.createElement('td');
						stateCell.textContent = goroutine.state;
						stateCell.classList.add(goroutine.state.toLowerCase());
						row.appendChild(stateCell);

						// Function cell
						const funcCell = document.createElement('td');
						funcCell.textContent = goroutine.function;
						row.appendChild(funcCell);

						// Details/Stack cell
						const detailsCell = document.createElement('td');
						const detailsButton = document.createElement('button');
						detailsButton.textContent = 'Show Stack';

						const stackDiv = document.createElement('div');
						stackDiv.classList.add('stack-trace', 'hidden');
						stackDiv.innerHTML = goroutine.stack.join('<br>');

						detailsButton.addEventListener('click', () => {
							stackDiv.classList.toggle('hidden');
							detailsButton.textContent = stackDiv.classList.contains('hidden')
								? 'Show Stack'
								: 'Hide Stack';
						});

						detailsCell.appendChild(detailsButton);
						detailsCell.appendChild(stackDiv);
						row.appendChild(detailsCell);

						tbody.appendChild(row);
					});
				});
			}

			// Update all UI components
			function updateUI() {
				window.getGoroutineStats().then((statsJson) => {
					historyData = JSON.parse(statsJson);
					updateCharts();
					updateStats();
					updateGoroutineTable();
				});
			}

			// Initialize and set up update callback
			window.addEventListener('load', () => {
				initCharts();

				// Define the callback that Go will call when data updates
				window.goroutineDataUpdated = function () {
					updateUI();
				};

				// Initial update
				updateUI();

				// Periodic updates as backup
				setInterval(updateUI, 5000);
			});
		</script>
	</body>
</html>
